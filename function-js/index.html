

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- Aula de arrow function e setInterval (função anônima) -->
     <div id="caixa"></div>
<style>
    body{
        background:#222;
    }
    #caixa{
        width: 50px;
        height: 50px;
        background: red;
        position: absolute;
        left: 0px;
        right: 0px;
        top: 0px; /* Pode movimentar-se no campo/tela inteiro. */
    }
</style>
<script>
let caixa = document.getElementById('caixa');
let posicao = 0;

setInterval(()=>{
    posicao += 5;
    caixa.style.left = posicao + "px";
    caixa.style.top = posicao + "px";
    caixa.style.right = posicao - "px"; //posicao = posicao + 5
},100);







</script>
</body>
</html>
