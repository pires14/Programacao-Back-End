

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <!-- Aula de arrow function e setInterval (função anônima) -->
     <div id="caixa"></div>
<style>
    body{
        background:#222;
    }
    #caixa{
        width: 50px;
        height: 50px;
        background: red;
        position: absolute;
        left: 0px;
        top: 0px;
         /* Pode movimentar-se no campo/tela inteiro. */
    }
</style>
<script>
let caixa = document.getElementById('caixa');
let x = 0;
let y = 0;  //y e, programação aumenta para baixo.
let direcao = "direita";
setInterval(()=>{
    switch(direcao){
        case "direita": x+=5; if(x>1865) direcao = "baixo"; break
        case "baixo": y+=5; if(y>895) direcao = "esquerda"; break
        case "esquerda": x-=5; if(x<0) direcao = "cima"; break
        case "cima": y-=5; if(y<0) direcao = "direita"; break
    }
    caixa.style.left = x + "px";
    caixa.style.top = y + "px";
    //posicao = posicao + 5
},1);







</script>
</body>
</html>
