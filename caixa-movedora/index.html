<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>
<!-- aula de arrow function e setInterval-->
<div id="caixa"></div>
<style>
body{
background: #222;
}
#caixa{
width: 50px;
height: 50px;
background:red;
position: absolute; 
left: 0px;
top: 0px;

}
</style>
<script>
let caixa = document.getElementById("caixa");
let x = 0
let y = 0;
let direcao = ""

document.addEventListener("keydown", (e)=>{ //captura de tecla. A letra e simboliza uma variável de evento
    direcao = e.key; //direção recebe a tecla pressionada
})
setInterval(()=>{
switch(direcao){
    case"ArrowRight": x +=5;break;
    case "ArrowLeft": x -=5;break;
    case "ArrowUp": y -=5;break;
    case "ArrowDown": y +=5;break;

}
caixa.style.left = x + "px";
caixa.style.top = y + "px";

},10);

</script>


</body>
</html>
